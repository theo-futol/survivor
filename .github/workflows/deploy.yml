name: DEPLOY

on:
    workflow_run:
        workflows: ["MIRROR"]
        types:
            - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    create_release:
        name: Create Release
        permissions: {
          contents: write,
          issues: write,
          pull-requests: write,
          id-token: write
        }
        if: github.repository == 'theo-futol/survivor' && github.event.workflow_run.conclusion == 'success'
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        outputs:
          released: ${{ steps.release.outputs.released }}
          version: ${{ steps.release.outputs.version }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Version: 7.0.1

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Version: 7.0.0
              with:
                node-version: 24

            - name: Cache node_modules
              id: cache-node-modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # Version: 6.1.0
              with:
                path: Ticket Tout/node_modules
                key: node-modules-${{ runner.os }}-24-${{ hashFiles('Ticket Tout/package-lock.json') }}

            - name: Install Dependencies
              if: steps.cache-node-modules.outputs.cache-hit != 'true'
              run: cd Ticket\ Tout && npm ci --prefer-offline --no-audit --no-fund

            - name: Run semantic-release
              id: release
              run: |
                cd Ticket\ Tout
                PRE_VERSION=$(node -p "require('./package.json').version")
                npm rebuild && npx semantic-release
                POST_VERSION=$(node -p "require('./package.json').version")
                if [ "$PRE_VERSION" != "$POST_VERSION" ]; then
                  echo "released=true" >> "$GITHUB_OUTPUT"
                  echo "version=$POST_VERSION" >> "$GITHUB_OUTPUT"
                else
                  echo "released=false" >> "$GITHUB_OUTPUT"
                fi
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build_and_push_image:
        name: Build and Push Docker Image
        needs: create_release
        if: needs.create_release.outputs.released == 'true'
        permissions: {
          contents: read,
          packages: write
        }
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Version: 7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # Version: 4.3.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # Version: 4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # Version: 7.3.0
              with:
                context: ./Ticket Tout
                target: prod-stage
                push: true
                tags: |
                  ghcr.io/${{ github.repository }}:${{ needs.create_release.outputs.version }}
                  ghcr.io/${{ github.repository }}:latest

            - name: Build and push garage-config image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # Version: 7.3.0
              with:
                context: ./garage-init
                push: true
                tags: |
                  ghcr.io/${{ github.repository }}/garage-config:${{ needs.create_release.outputs.version }}
                  ghcr.io/${{ github.repository }}/garage-config:latest