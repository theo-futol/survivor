openapi: 3.0.0
info:
  title: Ticket Tout API
  description: API de gestion des crédits employeur, des paiements simulés et de l'authentification pour Ticket Tout.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Serveur de développement local

paths:
  /qrcode:
    post:
      summary: Génération d'un QR code de paiement
      description: Génère un QR code de paiement pour le salarié authentifié, valide 5 minutes. Le contenu est haché (SHA-256) avant stockage ; seul le code en clair est retourné au client. Un seul QR code valide est autorisé par salarié et par entreprise partenaire à la fois.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrCodeRequest'
      responses:
        '201':
          description: QR code généré avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeResponse'
        '400':
          description: Corps de requête invalide.
        '401':
          description: Token manquant ou invalide.
        '403':
          description: Rôle insuffisant, ou tentative de génération pour un autre salarié.
        '404':
          description: Entreprise partenaire introuvable.
        '409':
          description: Un QR code valide existe déjà pour ce salarié et cette entreprise.
        '500':
          description: Erreur serveur interne.

  /login:
    post:
      summary: Authentification par email et mot de passe
      description: "Vérifie les identifiants et retourne un token JWT valide 1 heure, contenant le rôle de l'utilisateur. Ce token doit être transmis via le header `Authorization: Bearer <token>` pour toutes les requêtes authentifiées suivantes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Corps de requête invalide.
        '401':
          description: Identifiants invalides.
        '500':
          description: Erreur serveur interne.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    QrCodeRequest:
      type: object
      required:
        - companyId
        - userId
      properties:
        companyId:
          type: string
          description: Identifiant de l'entreprise partenaire où le QR code sera utilisé.
          example: 3f2e1d0a-4b8c-4e2a-9c1a-0f6b2a7d5e3c
        userId:
          type: string
          description: Identifiant du salarié ; doit correspondre à l'utilisateur authentifié (sinon `403`).
          example: 3f2e1d0a-4b8c-4e2a-9c1a-0f6b2a7d5e3c
    QrCodeResponse:
      type: object
      required:
        - qrcode
        - expiresAt
      properties:
        qrcode:
          type: string
          description: Code en clair à encoder dans le QR code côté frontend.
          example: xkekE24...
        expiresAt:
          type: string
          format: date-time
          example: '2026-09-02T12:34:56Z'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: secret
    LoginResponse:
      type: object
      required:
        - token
        - expiresIn
        - user
      properties:
        token:
          type: string
          example: eyJhbGci...
        expiresIn:
          type: integer
          example: 3600
        user:
          type: object
          required:
            - id
            - role
          properties:
            id:
              type: string
              example: 3f2e1d0a-4b8c-4e2a-9c1a-0f6b2a7d5e3c
            role:
              type: string
              example: employeur
