# Render Blueprint for Ticket Tout — free-tier only.
#
# Diverges from docker-compose.yml:
#  - Postgres and Redis are Render-managed (databases: / type: keyvalue)
#    instead of self-hosted postgres:18 / redis:7 containers.
#  - tickettout-app is built directly from Ticket Tout/Dockerfile on
#    Render (runtime: docker), not pulled from ghcr.io — avoids the
#    private-registry "unauthorized" pull failure already hit on
#    Cloudflare when no registry credentials are configured. No `target`
#    override is needed: prod-stage is the LAST stage in that Dockerfile,
#    and Docker builds the last stage by default.
#  - Garage (S3-compatible storage for KBIS/documents) is NOT deployed
#    here: it requires a private service, and Render has no Free plan
#    for private services at all (only Web/Postgres/Key Value support
#    Free instances) — confirmed against render.com/docs/free. Document
#    upload features in the app won't work until storage is added,
#    e.g. an external S3-compatible provider or a paid pserv later.
#
# Free-plan caveats worth knowing (render.com/docs/free):
#  - tickettout-db: 1 GB cap, expires 30 days after creation, no backups.
#  - tickettout-redis: in-memory only, data lost on every restart.
#  - tickettout-app: spins down after 15 min idle (~1 min cold start),
#    ephemeral filesystem (fine here — the app doesn't write local state
#    outside Garage, which isn't deployed).

databases:
  - name: tickettout-db
    plan: free
    postgresMajorVersion: "18"

services:
  - type: keyvalue
    name: tickettout-redis
    plan: free
    maxmemoryPolicy: noeviction
    # No external access needed — only tickettout-app talks to this,
    # over Render's private network.
    ipAllowList: []

  - type: web
    name: tickettout-app
    runtime: docker
    dockerContext: ./Ticket Tout
    dockerfilePath: ./Ticket Tout/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        # NOTE: verify this connection string works as-is for
        # `npm run db:migrate` at container startup — if Prisma Next
        # needs the `?schema=public` suffix that .env.example's
        # DATABASE_URL carries and Render's connectionString omits it,
        # override this with a static value (copy Render's string +
        # append `?schema=public`) instead of the dynamic binding below.
        fromDatabase:
          name: tickettout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tickettout-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "1800"
      - key: BETTER_AUTH_SECRET
        generateValue: true
